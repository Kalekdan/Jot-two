services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jot-adapters:
    build: .
    command: python -m src.main_adapters
    environment:
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_POLL_TIMEOUT=${TELEGRAM_POLL_TIMEOUT:-20}
      - TELEGRAM_RETRY_DELAY=${TELEGRAM_RETRY_DELAY:-2}
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  jot-core:
    build: .
    command: python -m src.main_core
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_CHAT_ENDPOINT=${OPENAI_CHAT_ENDPOINT:-/v1/chat/completions}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-nano}
      - OPENAI_SYSTEM_PROMPT=${OPENAI_SYSTEM_PROMPT:-You are Jot-two, a concise and helpful assistant.}
      - OPENAI_MAX_COMPLETION_TOKENS=${OPENAI_MAX_COMPLETION_TOKENS:-500}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy

  jot-router:
    build: .
    command: python -m src.main_router
    environment:
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
