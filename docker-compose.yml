services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-jot}
      - POSTGRES_USER=${POSTGRES_USER:-jot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jot}
    ports:
      - "5432:5432"
    volumes:
      - jot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jot} -d ${POSTGRES_DB:-jot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  jot-adapters:
    build: .
    command: python -m src.main_adapters
    environment:
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_POLL_TIMEOUT=${TELEGRAM_POLL_TIMEOUT:-20}
      - TELEGRAM_RETRY_DELAY=${TELEGRAM_RETRY_DELAY:-2}
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  jot-core:
    build: .
    command: python -m src.main_core
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-jot}:${POSTGRES_PASSWORD:-jot}@postgres:5432/${POSTGRES_DB:-jot}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_CHAT_ENDPOINT=${OPENAI_CHAT_ENDPOINT:-/v1/chat/completions}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-nano}
      - OPENAI_SYSTEM_PROMPT_FILE=${OPENAI_SYSTEM_PROMPT_FILE:-/app/system_prompt.txt}
      - OPENAI_SUMMARY_EVERY_MESSAGES=${OPENAI_SUMMARY_EVERY_MESSAGES:-10}
      - OPENAI_RECENT_MESSAGES_LIMIT=${OPENAI_RECENT_MESSAGES_LIMIT:-10}
      - OPENAI_MAX_TOOL_ROUNDS=${OPENAI_MAX_TOOL_ROUNDS:-5}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-60}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY:-}
      - OPENWEATHERMAP_BASE_URL=${OPENWEATHERMAP_BASE_URL:-https://api.openweathermap.org/data/2.5/weather}
      - OPENWEATHERMAP_FORECAST_BASE_URL=${OPENWEATHERMAP_FORECAST_BASE_URL:-https://api.openweathermap.org/data/2.5/forecast}
      - OPENWEATHERMAP_TIMEOUT_SECONDS=${OPENWEATHERMAP_TIMEOUT_SECONDS:-10}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  jot-router:
    build: .
    command: python -m src.main_router
    environment:
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy

  jot-webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-jot}:${POSTGRES_PASSWORD:-jot}@postgres:5432/${POSTGRES_DB:-jot}}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  jot_postgres_data:
